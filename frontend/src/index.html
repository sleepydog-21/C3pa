<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>C3pa — Plataforma de Colaboración y Modelado Metabólico</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Curvas y timing física Emil Kowalski & Apple */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --duration-press: 120ms;
      --duration-ui: 180ms;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Feedback táctil universal (Principio de retroalimentación física) */
    button:active, .btn:active, .location-chip:active, .tag-chip:active {
      transform: scale(0.97) !important;
      transition: transform var(--duration-press) var(--ease-out) !important;
    }

    /* Accesibilidad: Respeta la preferencia de movimiento reducido */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
